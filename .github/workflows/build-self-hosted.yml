name: build-self-hosted

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/build-self-hosted.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'ci/**'
      - 'examples/**'
      - 'ggml.pc.in'
      - 'include/**'
      - 'requirements.txt'
      - 'src/**'
      - 'tests/**'
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/build-self-hosted.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'ci/**'
      - 'examples/**'
      - 'ggml.pc.in'
      - 'include/**'
      - 'requirements.txt'
      - 'src/**'
      - 'tests/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # note: this is dud token to avoid rate limiting (https://github.com/ggml-org/llama.cpp/pull/25706#issuecomment-4979941302)
  HF_TOKEN: ${{ secrets.HF_TOKEN_CI }}

jobs:
  x64-nvidia-cuda:
    runs-on: "hf-jobs-t4-small:cuda13"

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake libssl-dev time unzip wget python3 python3-venv python3-pip

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          restore: false
          save: false

      - name: ccache-buckets-restore
        uses: ./.github/actions/ccache-buckets
        with:
          key: self-hosted-x64-nvidia-cuda
          folder: ggml
          hf_bucket: ggml-org/cache

      - name: Test
        id: ggml-ci
        run: |
          nvidia-smi
          GG_BUILD_CUDA=1 CUDACXX=/usr/local/cuda/bin/nvcc bash ./ci/run.sh ~/results/ggml ~/mnt/ggml

      - name: ccache-buckets-save
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: ./.github/actions/ccache-buckets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_CACHE_OUTPUT }}
        with:
          key: self-hosted-x64-nvidia-cuda
          folder: ggml
          evict-old-files: 1d
          hf_bucket: ggml-org/cache
          save: true

  x64-nvidia-vulkan-cm:
