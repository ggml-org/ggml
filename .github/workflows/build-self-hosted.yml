        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_CACHE_OUTPUT }}
        with:
          key: self-hosted-amd-vulkan
          folder: ggml
          evict-old-files: 1d
          hf_bucket: ggml-org/cache
          save: true
