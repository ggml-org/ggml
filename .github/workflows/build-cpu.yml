name: build-cpu

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/build-cpu.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'ci/**'
      - 'examples/**'
      - 'ggml.pc.in'
      - 'include/**'
      - 'requirements.txt'
      - 'src/**'
      - 'tests/**'
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/build-cpu.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'ci/**'
      - 'examples/**'
      - 'ggml.pc.in'
      - 'include/**'
      - 'requirements.txt'
      - 'src/**'
      - 'tests/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  cpu:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64-cpu-low-perf
            os: ubuntu-22.04
            packages: build-essential libcurl4-openssl-dev
            env: GG_BUILD_LOW_PERF=1
          - name: arm64-cpu-low-perf
            os: ubuntu-22.04-arm
            packages: build-essential libcurl4-openssl-dev
            env: GG_BUILD_LOW_PERF=1
          - name: x64-cpu-high-perf
            os: ubuntu-22.04
            packages: build-essential libcurl4-openssl-dev
            env: ""
          - name: arm64-cpu-high-perf
            os: ubuntu-22.04-arm
            packages: build-essential libcurl4-openssl-dev
            env: GG_BUILD_NO_SVE=1 GG_BUILD_NO_BF16=1 GG_BUILD_EXTRA_TESTS_0=1
          - name: arm64-cpu-high-perf-sve
            os: ubuntu-22.04-arm
            packages: build-essential libcurl4-openssl-dev
            env: GG_BUILD_NO_BF16=1 GG_BUILD_EXTRA_TESTS_0=1
          # Microsoft doesn't support 32-bit runners; this cross-compiles.
          - name: x86-cpu-32-bit
            os: ubuntu-22.04
            packages: build-essential gcc-multilib g++-multilib
            env: GG_BUILD_32BIT=1

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.16
        with:
          key: ggml-ci-${{ matrix.name }}
          evict-old-files: 1d

      - name: Dependencies
        id: depends
        run: |
          sudo apt-get update
          sudo apt-get install ${{ matrix.packages }}

      - name: Test
        id: ggml-ci
        run: |
          LLAMA_ARG_THREADS=$(nproc) ${{ matrix.env }} bash ./ci/run.sh ./tmp/results ./tmp/mnt
